name: Fetch Market Data

on:
  schedule:
    # 22:00 UTC = 5:00 PM ET (after US market close). Runs Mon–Fri only.
    - cron: '0 22 * * 1-5'
    # 10:01 UTC = 3:31 PM IST (after Indian market close). Runs Mon–Fri only.
    - cron: '1 10 * * 1-5'
  workflow_dispatch:      # Allow manual trigger from the GitHub Actions UI.
    inputs:
      request_delay:
        description: 'Seconds between API calls (default 1.2 for Grow 55 plan)'
        required: false
        default: '1.2'
      market:
        description: 'Which market to fetch: sp500, nifty500, or all'
        required: false
        default: 'all'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Needed to commit the generated data files.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch market data
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          REQUEST_DELAY: ${{ github.event.inputs.request_delay || '1.2' }}
          # Scheduled runs: pick market based on which cron fired. Manual runs use the input.
          MARKET: >-
            ${{
              github.event_name == 'workflow_dispatch' && github.event.inputs.market ||
              (github.event.schedule == '1 10 * * 1-5' && 'nifty500') ||
              'sp500'
            }}
        run: python scripts/fetch_market_data.py

      - name: Commit and push data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
          else
            COUNT=$(git diff --cached --name-only | wc -l | tr -d ' ')
            git commit -m "chore: update market data $(date -u +%Y-%m-%d) (${COUNT} files)"
            git push
          fi
